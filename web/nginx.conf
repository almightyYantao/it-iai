server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Static assets: long cache (filenames are hashed by Vite).
  location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SSE-safe: no buffering, long read timeout, http/1.1.
  location /v1/ {
    proxy_pass http://control-plane:8080/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /healthz {
    proxy_pass http://control-plane:8080/healthz;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
