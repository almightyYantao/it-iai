server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Static assets: long cache (filenames are hashed by Vite).
  location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SSE-safe: no buffering, long read timeout, http/1.1.
  location /v1/ {
    proxy_pass http://control-plane:8080/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /healthz {
    proxy_pass http://control-plane:8080/healthz;
  }

  # Source-tarball uploads. The Skill PUTs to a presigned URL; MinIO's own port
  # is not reachable from developer machines, so the presigned URL is issued
  # against this host (CP_S3_PUBLIC_ENDPOINT) and proxied from here.
  #
  # SigV4 signs the Host header and the URI path, so both must survive the hop
  # untouched: no path rewrite (note proxy_pass without a trailing path), and
  # Host forwarded as received. Getting either wrong yields
  # SignatureDoesNotMatch, not a routing error, which is a confusing way to
  # find out.
  #
  # The prefix is the bucket name (CP_S3_BUCKET_SOURCE) because presigned URLs
  # are path-style — rename the bucket and this location has to follow.
  location /vibedeploy-source/ {
    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    # Tarballs run to tens of MB; the default 1m would 413 them. Stream straight
    # through rather than spooling the whole body to disk first.
    client_max_body_size 1g;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
