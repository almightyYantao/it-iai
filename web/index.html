  <head>

    <title>iai · deploy</title>
    <!-- Inline SVG favicon — brand blue rounded square + "ai" in white. No
         external file needed; renders crisp at every DPR. `#` in the colour
         is URL-encoded as %23 and `%` inside style values as %25. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231a78d1'/><text x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Inter,system-ui,-apple-system,sans-serif' font-size='34' font-weight='700' letter-spacing='-2' fill='white'>ai</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html { background: oklch(99% 0.003 250); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
